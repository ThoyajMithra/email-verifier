<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Validator</title>
</head>

<body style="display:flex;gap:20px;align-items:flex-start">
    <div>
        <h2>Email Validator</h2>

        <p>Enter email addresses, one per line.</p>

        <textarea
            id="input"
            cols="48"
            rows="8"
            placeholder="alice@gmail.com&#10;bob@yahoo.com&#10;someone@example.com"
        ></textarea>

        <br><br>

        <button id="send">Validate Emails</button>
    </div>

    <div>
        <h3>Results</h3>

        <table id="result" border="1" style="border-collapse: collapse; width: 100%; max-width: 1100px; text-align: left;">
            <thead>
                <tr>
                    <th style="padding: 10px; min-width: 250px;">Email</th>
                    <th style="padding: 10px; min-width: 120px;">Status</th>
                    <th style="padding: 10px; min-width: 100px;">MX</th>
                    <th style="padding: 10px; min-width: 100px;">SMTP</th>
                    <th style="padding: 10px; min-width: 140px;">Mailbox Exists</th>
                    <th style="padding: 10px; min-width: 250px;">Message</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <pre id="error"></pre>
    </div>

    <script>
        const input = document.getElementById("input");
        const result = document.getElementById("result");
        const tbody = result.querySelector("tbody");
        const button = document.getElementById("send");
        const errorElement = document.getElementById("error");

        button.addEventListener("click", async () => {
            const emails = input.value
                .split(/\r?\n/)
                .map(email => email.trim())
                .filter(email => email.length > 0);

            errorElement.textContent = "";

            if (emails.length === 0) {
                tbody.innerHTML = "<tr><td colspan='6'>Please enter at least one email address.</td></tr>";
                return;
            }

            button.disabled = true;
            tbody.innerHTML = "<tr><td colspan='6'>Validating emails...</td></tr>";

            try {
                const response = await fetch(
                    "https://email-verifier-p4yg.onrender.com/api/process",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ emails })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.detail
                            ? JSON.stringify(data.detail)
                            : `HTTP ${response.status}`
                    );
                }

                tbody.innerHTML = "";

                data.results.forEach(r => {
                    const tr = document.createElement("tr");

                    const values = [
                        r.email,
                        r.status,
                        r.result?.checks?.hasMxRecords ?? "Unknown",
                        r.result?.checks?.smtpConnectable ?? "Unknown",
                        r.result?.checks?.mailboxExists ?? "Unknown",
                        r.message
                    ];

                    values.forEach(value => {
                        const td = document.createElement("td");
                        td.style.padding = "10px";
                        td.textContent = value;
                        tr.appendChild(td);
                    });

                    tbody.appendChild(tr);
                });

            } catch (error) {
                tbody.innerHTML = "";
                errorElement.textContent = "Error: " + error.message;
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
